<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Pro Meity ?</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --pink-main: #ff85a2; --pink-gradient: linear-gradient(135deg, #ff85a2 0%, #ffacbd 100%); --pink-soft: #fff0f3; --text-dark: #4a4a4a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }
        body { background: linear-gradient(135deg, #fbb1bd 0%, #ffeaee 100%); min-height: 100vh; display: flex; justify-content: center; padding: 20px 15px; color: var(--text-dark); }
        .container { width: 100%; max-width: 480px; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(15px); padding: 25px; border-radius: 40px; box-shadow: 0 25px 50px rgba(255, 133, 162, 0.3); border: 1px solid white; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 28px; background: var(--pink-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
        .welcome-box { background: white; padding: 20px; border-radius: 30px; margin-bottom: 20px; border: 1.5px solid rgba(255, 133, 162, 0.1); }
        .progress-bar { width: 100%; height: 8px; background: var(--pink-soft); border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .progress-fill { width: 0%; height: 100%; background: var(--pink-gradient); transition: 0.5s ease; }
        
        /* SNAP SECTION */
        .daily-snap-card { background: white; padding: 15px; border-radius: 30px; margin-bottom: 20px; text-align: center; }
        .snap-preview { width: 100%; height: 220px; background: #fafafa; border-radius: 20px; overflow: hidden; margin-bottom: 10px; border: 1px dashed #ffacbd; display: flex; align-items: center; justify-content: center; position: relative;}
        .snap-preview img { width: 100%; height: 100%; object-fit: cover; }
        .snap-btn { background: var(--pink-gradient); color: white; padding: 10px 20px; border-radius: 15px; border: none; font-weight: 700; cursor: pointer; width: 100%; }
        
        /* HISTORY SECTION */
        .history-title { font-size: 14px; font-weight: 800; color: var(--pink-main); margin: 15px 0 10px; text-align: left; display: flex; align-items: center; gap: 5px;}
        .history-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .history-item { min-width: 80px; height: 80px; border-radius: 15px; overflow: hidden; flex-shrink: 0; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer;}
        .history-item img { width: 100%; height: 100%; object-fit: cover; }

        .agenda-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .agenda-card { background: white; padding: 15px; border-radius: 25px; text-align: center; }
        .val { font-size: 20px; font-weight: 900; color: var(--pink-main); display: block; }
        .lbl { font-size: 10px; font-weight: 700; color: #aaa; text-transform: uppercase; }
        .input-group { background: white; padding: 15px; border-radius: 25px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        input { padding: 12px; border: 2px solid #fdf2f4; border-radius: 15px; outline: none; }
        .task-card { background: white; padding: 15px; border-radius: 22px; display: flex; align-items: center; gap: 12px; margin-bottom: 10px; border: 1px solid #fff; }
        .check-circle { width: 22px; height: 22px; border: 2px solid var(--pink-soft); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; color: transparent;}
        .completed { opacity: 0.5; }
        .completed .check-circle { background: var(--pink-main); color: white; }
        .completed .task-title { text-decoration: line-through; }
    </style>
</head>
<body>
<div class="container">
    <header><h1>Todo Pro App</h1></header>
    <div class="welcome-box">
        <h2 id="greeting">Hello, Meity!</h2>
        <div id="quote-text" style="font-size: 12px; font-style: italic; color: #888; margin-top: 5px;"></div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="daily-snap-card">
        <div class="snap-preview" id="snap-preview">
            <img id="snap-img" style="display: none;">
            <span id="placeholder-text">No today's memory</span>
        </div>
        <input type="file" accept="image/*" capture="camera" id="snap-input" style="display: none;">
        <button class="snap-btn" onclick="document.getElementById('snap-input').click()">?? Take Today's Snap</button>
        
        <div class="history-title">?? Memory History</div>
        <div class="history-scroll" id="history-scroll">
            </div>
    </div>

    <div class="agenda-grid">
        <div class="agenda-card"><span class="val" id="count-today">0</span><span class="lbl">Today</span></div>
        <div class="agenda-card"><span class="val" id="count-total">0</span><span class="lbl">Total</span></div>
    </div>

    <div class="input-group">
        <input type="text" id="taskInput" placeholder="What's next?">
        <input type="date" id="dateInput">
        <button class="snap-btn" id="addBtn">Add Task ??</button>
    </div>
    <div id="taskList"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, updateDoc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBWeo6KAo6GsKHusxDGJB8kp_03-jB944w",
        authDomain: "meitytodopro.firebaseapp.com",
        projectId: "meitytodopro",
        storageBucket: "meitytodopro.appspot.com",
        messagingSenderId: "820068449861",
        appId: "1:820068449861:web:1ce45248eb06c8714cad2c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const tasksCol = collection(db, "todo_meity");
    const snapsCol = collection(db, "daily_snaps");

    // Dynamic UI
    const hr = new Date().getHours();
    document.getElementById('greeting').innerText = hr < 12 ? "Good Morning, Meity! ??" : hr < 17 ? "Good Afternoon, Meity! ???" : "Good Evening, Meity! ?";
    document.getElementById('quote-text').innerText = "Make it happen today. ??";
    document.getElementById('dateInput').valueAsDate = new Date();

    // Tasks & Progress
    onSnapshot(query(tasksCol, orderBy("createdAt", "desc")), (snap) => {
        const list = document.getElementById('taskList'); list.innerHTML = '';
        let total = 0, done = 0, today = 0;
        const todayStr = new Date().toISOString().split('T')[0];
        snap.forEach(d => {
            const t = d.data(); total++;
            if(t.completed) done++;
            if(t.date === todayStr && !t.completed) today++;
            const card = document.createElement('div');
            card.className = `task-card ${t.completed ? 'completed' : ''}`;
            card.innerHTML = `<div class="check-circle" onclick="toggleT('${d.id}', ${t.completed})">?</div><div style="flex:1"><div class="task-title" style="font-weight:700;font-size:14px">${t.text}</div><div style="font-size:10px;color:var(--pink-main)">${t.date}</div></div><button style="border:none;background:none;cursor:pointer" onclick="delT('${d.id}')">???</button>`;
            list.appendChild(card);
        });
        document.getElementById('count-total').innerText = total;
        document.getElementById('count-today').innerText = today;
        document.getElementById('progress-fill').style.width = total > 0 ? (done/total*100)+'%' : '0%';
    });

    window.toggleT = (id, s) => updateDoc(doc(db, "todo_meity", id), { completed: !s });
    window.delT = (id) => confirm('Delete?') && deleteDoc(doc(db, "todo_meity", id));
    document.getElementById('addBtn').onclick = async () => {
        const t = document.getElementById('taskInput');
        if(t.value) await addDoc(tasksCol, { text: t.value, date: document.getElementById('dateInput').value, completed: false, createdAt: Date.now() });
        t.value = '';
    };

    // HISTORY & SNAP LOGIC
    async function updateSnaps() {
        const q = query(snapsCol, orderBy("timestamp", "desc"));
        const snapDocs = await getDocs(q);
        const scroll = document.getElementById('history-scroll');
        const todayStr = new Date().toISOString().split('T')[0];
        scroll.innerHTML = '';
        
        snapDocs.forEach(d => {
            const data = d.data();
            // Update Main Preview if it's today
            if(d.id === todayStr) {
                document.getElementById('snap-img').src = data.img;
                document.getElementById('snap-img').style.display = 'block';
                document.getElementById('placeholder-text').style.display = 'none';
            }
            // Add to History Scroll
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<img src="${data.img}" onclick="document.getElementById('snap-img').src='${data.img}'">`;
            scroll.appendChild(item);
        });
    }
    updateSnaps();

    document.getElementById('snap-input').onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const max = 600;
                const scale = Math.min(max/img.width, max/img.height);
                canvas.width = img.width * scale; canvas.height = img.height * scale;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                ctx.font = 'bold 20px Quicksand'; ctx.fillStyle = 'white';
                ctx.shadowColor = "black"; ctx.shadowBlur = 5;
                ctx.fillText(new Date().toLocaleDateString(), 15, canvas.height - 15);
                
                const base64 = canvas.toDataURL('image/jpeg', 0.6);
                const today = new Date().toISOString().split('T')[0];
                setDoc(doc(db, "daily_snaps", today), { img: base64, timestamp: Date.now() }).then(updateSnaps);
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    };
</script>
</body>
</html>
