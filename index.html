<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Pro Meity ?</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --pink: #ff85a2; --soft-pink: #fff5f7; --text: #4a4a4a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }
        
        body { background: #fffafa; min-height: 100vh; display: flex; justify-content: center; padding: 20px; color: var(--text); }
        body::before { content: '??'; position: fixed; top: 10%; left: 5%; font-size: 30px; opacity: 0.2; }
        body::after { content: '??'; position: fixed; bottom: 10%; right: 5%; font-size: 25px; opacity: 0.2; }

        .container { width: 100%; max-width: 420px; background: white; padding: 30px; border-radius: 40px; box-shadow: 0 20px 40px rgba(255, 133, 162, 0.15); border: 1px solid #ffeaee; position: relative; }
        header { text-align: center; margin-bottom: 25px; }
        header h1 { font-size: 28px; color: var(--pink); font-weight: 800; }
        header p { font-size: 13px; color: #bbb; font-weight: 700; margin-top: 5px; }

        .welcome-box { background: white; padding: 20px; border-radius: 25px; margin-bottom: 25px; border: 1.5px solid var(--soft-pink); }
        .welcome-box h2 { font-size: 18px; color: var(--pink); margin-bottom: 5px; }
        .quote { font-size: 12px; color: #aaa; font-style: italic; margin-bottom: 15px; }
        .progress-bar { width: 100%; height: 8px; background: #f0f0f0; border-radius: 10px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--pink); transition: 0.8s; }

        .snap-card { margin-top: 25px; margin-bottom: 25px; text-align: center; }
        .snap-display { width: 100%; height: 230px; background: #fafafa; border-radius: 30px; overflow: hidden; border: 2px dashed #ffcbd7; display: flex; align-items: center; justify-content: center; }
        .snap-display img { width: 100%; height: 100%; object-fit: cover; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-snap { background: var(--pink); color: white; padding: 12px; border-radius: 18px; border: none; font-weight: 800; flex: 1; cursor: pointer; box-shadow: 0 8px 15px rgba(255,133,162,0.2); }
        .btn-del { background: #f5f5f5; color: #888; padding: 12px; border-radius: 18px; border: none; width: 60px; cursor: pointer; }

        .history-title { font-size: 11px; color: #ccc; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; text-align: left; padding-left: 5px; }
        .history-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 5px 0; scrollbar-width: none; }
        .hist-item { min-width: 60px; height: 60px; border-radius: 50%; border: 3px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.08); overflow: hidden; flex-shrink: 0; cursor: pointer; }

        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #fffcfd; padding: 15px; border-radius: 20px; text-align: center; border: 1px solid #fff0f3; }
        
        .input-box { background: white; padding: 20px; border-radius: 25px; margin-bottom: 25px; border: 1.5px solid var(--soft-pink); }
        input { width: 100%; padding: 12px; border: 1.5px solid #fff5f7; border-radius: 15px; margin-bottom: 10px; outline: none; background: #fffafa; font-weight: 600; }

        .task { display: flex; align-items: center; gap: 12px; padding: 15px; background: white; border-radius: 20px; margin-bottom: 12px; border: 1px solid #fcfcfc; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .circle { width: 24px; height: 24px; border: 2.5px solid var(--soft-pink); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; color: transparent; }
        .done { opacity: 0.5; }
        .done .circle { background: var(--pink); border-color: var(--pink); color: white; }
        .done b { text-decoration: line-through; }
        .actions { margin-left: auto; display: flex; gap: 10px; }
        .icon-btn { border: none; background: none; cursor: pointer; font-size: 16px; opacity: 0.6; }

        .reset-container { text-align: center; margin-top: 30px; border-top: 1px dashed #ffe0e5; padding-top: 20px; }
        .btn-reset-all { background: none; border: none; color: #ffb3c6; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
        .btn-reset-all:hover { color: #ff4d6d; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Todo Pro App ??</h1>
        <p>Organize your day better</p>
    </header>

    <div class="welcome-box">
        <h2 id="greeting">Hello, Meity! ??</h2>
        <div class="quote">"Every moment matters."</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="snap-card">
        <div class="snap-display" id="snap-preview">
            <img id="snap-img" style="display: none;">
            <span style="color:#ddd; font-weight:800; font-size:11px; letter-spacing:1px;">CAPTURE A SNAP ??</span>
        </div>
        <input type="file" accept="image/*" capture="camera" id="file-in" style="display: none;">
        <div class="btn-group">
            <button class="btn-snap" onclick="document.getElementById('file-in').click()">Take a Snap ??</button>
            <button class="btn-del" onclick="deleteSnap()">???</button>
        </div>
        <div class="history-title" style="margin-top:20px;">Memory Lane</div>
        <div class="history-scroll" id="history-list"></div>
    </div>

    <div class="stats">
        <div class="stat-card"><b style="color:var(--pink); font-size:20px;" id="c-today">0</b><br><small style="color:#ccc; font-weight:800;">TODAY</small></div>
        <div class="stat-card"><b style="color:var(--pink); font-size:20px;" id="c-total">0</b><br><small style="color:#ccc; font-weight:800;">TOTAL</small></div>
    </div>

    <div class="input-box">
        <input type="text" id="t-in" placeholder="What's your plan?">
        <input type="date" id="d-in">
        <button class="btn-snap" style="width:100%" id="add-btn">Add to List ??</button>
    </div>
    
    <div id="taskList"></div>

    <!-- TOMBOL RESET KANDANG SAKURA -->
    <div class="reset-container">
        <button class="btn-reset-all" onclick="resetAllData()">?? Reset All Data ??</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, updateDoc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBWeo6KAo6GsKHusxDGJB8kp_03-jB944w",
        authDomain: "meitytodopro.firebaseapp.com",
        projectId: "meitytodopro",
        storageBucket: "meitytodopro.appspot.com",
        messagingSenderId: "820068449861",
        appId: "1:820068449861:web:1ce45248eb06c8714cad2c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const tCol = collection(db, "todo_meity");
    const sCol = collection(db, "daily_snaps");
    const today = new Date().toISOString().split('T')[0];

    document.getElementById('d-in').valueAsDate = new Date();
    const hr = new Date().getHours();
    document.getElementById('greeting').innerText = hr < 12 ? "Good Morning, Meity! ???" : hr < 17 ? "Good Afternoon, Meity! ??" : "Good Evening, Meity! ?";

    // Tasks
    onSnapshot(query(tCol, orderBy("createdAt", "desc")), (snap) => {
        const list = document.getElementById('taskList'); list.innerHTML = '';
        let total = 0, todayCount = 0, doneCount = 0;
        snap.forEach(d => {
            const t = d.data(); total++;
            if(t.completed) doneCount++;
            if(t.date === today && !t.completed) todayCount++;
            const div = document.createElement('div');
            div.className = `task ${t.completed ? 'done' : ''}`;
            div.innerHTML = `
                <div class="circle" onclick="toggle('${d.id}', ${t.completed})">?</div>
                <div style="flex:1"><b>${t.text}</b><br><small style="color:var(--pink); font-weight:700;">${t.date}</small></div>
                <div class="actions">
                    <button class="icon-btn" onclick="editT('${d.id}','${t.text}','${t.date}')">??</button>
                    <button class="icon-btn" onclick="delT('${d.id}')">???</button>
                </div>`;
            list.appendChild(div);
        });
        document.getElementById('c-total').innerText = total;
        document.getElementById('c-today').innerText = todayCount;
        document.getElementById('progress-fill').style.width = total > 0 ? (doneCount/total*100)+'%' : '0%';
    });

    window.toggle = (id, s) => {
        if(!s) confetti({ particleCount: 70, spread: 70, origin: { y: 0.8 }, colors: ['#ff85a2', '#ffffff'] });
        updateDoc(doc(db, "todo_meity", id), { completed: !s });
    };
    window.delT = (id) => confirm('Hapus tugas?') && deleteDoc(doc(db, "todo_meity", id));
    window.editT = async (id, oldT, oldD) => {
        const nT = prompt("Edit Task:", oldT); const nD = prompt("Edit Date:", oldD);
        if(nT && nD) await updateDoc(doc(db, "todo_meity", id), { text: nT, date: nD });
    };

    document.getElementById('add-btn').onclick = async () => {
        const v = document.getElementById('t-in');
        if(v.value) await addDoc(tCol, { text: v.value, date: document.getElementById('d-in').value, completed: false, createdAt: Date.now() });
        v.value = '';
    };

    // Snaps
    async function updateSnaps() {
        const snapDocs = await getDocs(query(sCol, orderBy("timestamp", "desc")));
        const scroll = document.getElementById('history-list'); scroll.innerHTML = '';
        let found = false;
        snapDocs.forEach(d => {
            const data = d.data();
            if(d.id === today) {
                document.getElementById('snap-img').src = data.img;
                document.getElementById('snap-img').style.display = 'block';
                found = true;
            }
            const item = document.createElement('div');
            item.className = 'hist-item';
            item.innerHTML = `<img src="${data.img}" style="width:100%;height:100%;object-fit:cover" onclick="document.getElementById('snap-img').src='${data.img}'; document.getElementById('snap-img').style.display='block';">`;
            scroll.appendChild(item);
        });
        if(!found) document.getElementById('snap-img').style.display = 'none';
    }
    updateSnaps();

    window.deleteSnap = async () => {
        if(confirm('Hapus foto hari ini?')) { await deleteDoc(doc(db, "daily_snaps", today)); updateSnaps(); }
    };

    document.getElementById('file-in').onchange = (e) => {
        const r = new FileReader();
        r.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                const cv = document.createElement('canvas'); const ctx = cv.getContext('2d');
                const scale = Math.min(800/img.width, 800/img.height);
                cv.width = img.width * scale; cv.height = img.height * scale;
                ctx.drawImage(img, 0, 0, cv.width, cv.height);
                const b64 = cv.toDataURL('image/jpeg', 0.6);
                setDoc(doc(db, "daily_snaps", today), { img: b64, timestamp: Date.now() }).then(updateSnaps);
            };
            img.src = ev.target.result;
        };
        r.readAsDataURL(e.target.files[0]);
    };

    // LOGIC AUTO-RESET MASSAL
    window.resetAllData = async () => {
        const conf1 = confirm("Meity serius mau hapus SEMUA data tugas & memory foto?");
        if (!conf1) return;
        
        const conf2 = confirm("Beneran ya? Data yang dihapus di Firebase tidak bisa dikembalikan lagi lho.");
        if (!conf2) return;

        try {
            // Hapus Tugas
            const taskDocs = await getDocs(tCol);
            const taskPromises = [];
            taskDocs.forEach(d => taskPromises.push(deleteDoc(doc(db, "todo_meity", d.id))));
            await Promise.all(taskPromises);

            // Hapus Snaps Foto
            const snapDocs = await getDocs(sCol);
            const snapPromises = [];
            snapDocs.forEach(d => snapPromises.push(deleteDoc(doc(db, "daily_snaps", d.id))));
            await Promise.all(snapPromises);

            alert("Semua data sukses dibersihkan! Aplikasi kembali seperti baru. ?");
            window.location.reload();
        } catch (error) {
            alert("Waduh gagal reset: " + error.message);
        }
    };
</script>
</body>
</html>
